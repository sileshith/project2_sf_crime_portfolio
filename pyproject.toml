[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sf-incident-forecasting"
version = "1.0.0"
description = "Reproducible analytics and forecasting for reported SFPD incidents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "Sileshi Hirpa" }]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=17,<22",
  "requests>=2.32,<3",
  "scikit-learn>=1.5,<2",
  "statsmodels>=0.14,<1",
  "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2,<5",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
sf-incidents-build = "sf_incidents.pipeline:main"
sf-incidents-evaluate = "sf_incidents.evaluate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sf_incidents"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
  "dashboard",
  "notebooks",
  "project2_SH.ipynb",
  "src/build_artifacts.py",
  "src/build_dashboard_artifacts.py",
  "src/validate_forecast.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
